# cargo-about: builds THIRD_PARTY_LICENSES.html, shipped inside every OpenDrape download.
# Keep `accepted` in sync with the allowlist in deny.toml.
accepted = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
