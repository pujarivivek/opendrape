[package]
name = "opendrape"
description = "Free, open-source 3D garment design for students"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
opendrape-core.workspace = true
opendrape-drape.workspace = true
opendrape-geom.workspace = true
opendrape-io.workspace = true
opendrape-mesh.workspace = true
opendrape-render.workspace = true
opendrape-sim.workspace = true
earcut.workspace = true
glam.workspace = true
arc-swap.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd.workspace = true
pollster.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The version eframe already uses, with only the features eframe asks for; needed to switch off
# macOS's default app menu (gpu/setup.rs).
winit = { version = "=0.30.13", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.packager]
productName = "OpenDrape"
identifier = "org.opendrape.OpenDrape"
publisher = "OpenDrape contributors"
copyright = "OpenDrape contributors, GPL-3.0-or-later"
category = "GraphicsAndDesign"
icons = ["../../assets/icon@2x.png"]
licenseFile = "../../LICENSE"
# Generated by the packaging scripts with `cargo about` before packaging.
resources = ["../../target/licenses/THIRD_PARTY_LICENSES.html"]
binaries = [{ path = "opendrape", main = true }]
macos = { minimumSystemVersion = "11.0" }
nsis = { installMode = "currentUser", installerIcon = "../../assets/icon.ico" }
