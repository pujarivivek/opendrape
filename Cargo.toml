[workspace]
resolver = "3"
members = ["crates/app", "crates/render", "crates/body", "crates/sim", "crates/testkit", "crates/core", "crates/geom", "crates/io", "crates/mesh", "crates/drape", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/pujarivivek/opendrape"
publish = false

[workspace.dependencies]
opendrape-render = { path = "crates/render" }
opendrape-body = { path = "crates/body" }
opendrape-sim = { path = "crates/sim" }
opendrape-testkit = { path = "crates/testkit" }
opendrape-core = { path = "crates/core" }
opendrape-geom = { path = "crates/geom" }
opendrape-io = { path = "crates/io" }
opendrape-mesh = { path = "crates/mesh" }
opendrape-drape = { path = "crates/drape" }
parry3d = "=0.31.1"
rayon = "1.12"
crossbeam-channel = "0.5"
arc-swap = "1"
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "wayland", "x11"] }
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui-phosphor = { version = "=0.14.0", default-features = false, features = ["regular"] }
egui_kittest = { version = "=0.36.2", features = ["wgpu", "eframe"] }
wgpu = "=30.0.1"
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = { version = "0.17", default-features = false }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
tempfile = "3"
kurbo = "0.13.1"
earcut = "0.4.11"
i_overlay = "9.0.1"
spade = "=2.15.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

# Optimise dependencies in debug builds so the 3D view is usable while developing.
[profile.dev.package."*"]
opt-level = 2

# i_overlay's generics are instantiated inside opendrape-geom (the cut line), so the "*"
# override above doesn't reach them: unoptimised, one heavy piece's cut line takes seconds.
[profile.dev.package.opendrape-geom]
opt-level = 2

# The fabric mesh is rebuilt whenever the pattern changes while the 3D view shows the pieces.
[profile.dev.package.opendrape-mesh]
opt-level = 2

# The drape is made again on every edit while it drapes (the warm start).
[profile.dev.package.opendrape-drape]
opt-level = 2

# Physics and its tests are unusably slow unoptimised.
[profile.dev.package.opendrape-body]
opt-level = 3
[profile.dev.package.opendrape-sim]
opt-level = 3
[profile.dev.package.opendrape-testkit]
opt-level = 3
